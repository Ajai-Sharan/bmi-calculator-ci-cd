# Deploy with: scripts/deploy.sh <commit-sha>
# The script replaces IMAGE_TAG below with the exact image version to run.

# ------------------------
# Configuration
# ------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: bmi-calculator-config
data:
  PORT: "3000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmi-calculator-api
  labels:
    app: bmi-calculator-api
spec:
  # 2 replicas so one pod can be replaced while the other keeps serving
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bmi-calculator-api
  template:
    metadata:
      labels:
        app: bmi-calculator-api
      annotations:
        # Tells a Prometheus server where to scrape metrics
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # The app never calls the Kubernetes API, so do not mount an API token
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: bmi-calculator-api
        image: docker.io/ajaisharan/bmi-calculator-api:IMAGE_TAG
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: bmi-calculator-config

        # ------------------------
        # Health Checks
        # ------------------------
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

        # ------------------------
        # Resource Management
        # ------------------------
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

        # ------------------------
        # Container Security
        # ------------------------
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: bmi-calculator-api-service
spec:
  type: LoadBalancer
  selector:
    app: bmi-calculator-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
